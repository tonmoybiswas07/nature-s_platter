<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title -->
    <title>Nature's Platter</title>
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="styles/tailwind.init.css" />
  </head>
  <body >

    <div class="bg class="bg-linear-to-t from-[#FFFFFF]-0% to-[#EFEBE3]-100%"">
      <!-- header section start here -->
    <header class=" max-w-7xl mx-auto flex justify-between items-center py-4">
      <div>
        <img src="./assets/nav-logo.png" alt="logo" />
      </div>
      <div>
        <nav>
          <ul class="flex justify-between items-center gap-6 text-xl">
            <li>Product</li>
            <li>Services</li>
            <li>Contact us</li>
          </ul>
        </nav>
      </div>
      <div class="flex gap-6 justify-between items-center">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-cart-shopping"></i>
        <button
          class="border-2 font-bold border-[#179800] px-8 py-2 rounded-xl"
        >
          Login
        </button>
        <button
          class="border-2 bg-[#179800] px-8 py-2 rounded-xl font-bold text-white border-[#179800]"
        >
          Register
        </button>
      </div>
    </header>
    <!-- header section end here -->
    <!-- main section start here -->
    <main class="max-w-7xl mx-auto">
      <!-- banner section start here -->
      <section class="banner mt-20 flex flex-col justify-center items-center">
        <div class="">
          <h1 class="text-6xl text-center font-bold">
            Freshness You <span class="text-[#179800]">Can</span><br />
            <span class="text-[#179800]">Count</span> On, Prices You’ll Love!
          </h1>
          <p class="text-xl text-center my-10">Shop your daily essentials at unbeatable prices. From fresh produce to pantry <br> staples, we’ve got you covered every day!</p>
        </div>
        <div class="h-[600px]">
          <img src="./assets/Hero Section 1.png" alt="" />
        </div>
      </section>
      <!-- banner section end here -->
    </main>

    <!-- main section end here -->
    </div>
  </body>
</html>
